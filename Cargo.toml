[workspace]
members = ["crates/core", "crates/io", "crates/desktop"]
default-members = ["crates/desktop"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
stick-optimizer-core = { path = "crates/core" }
stick-optimizer-io = { path = "crates/io" }
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow"] }
egui_extras = { version = "=0.36.2", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
